<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>むかしマップ｜史跡・博物館・美術館</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f5f1e8;--surface:#fff;--ink:#292622;--muted:#746f68;--line:#e7e0d5;--accent:#765c3c;--accent2:#4f6b52;--shadow:0 8px 28px rgba(52,43,31,.10)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
header{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);padding:15px 18px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000}
.brand{display:flex;align-items:center;gap:10px;max-width:1100px;margin:auto}.brandicon{width:40px;height:40px;border-radius:12px;background:#eee6d9;display:grid;place-items:center;font-size:21px}.brandtext h1{margin:0;font-size:20px;letter-spacing:.02em}.sub{font-size:12px;color:var(--muted);margin-top:2px}
#map{height:46vh;min-height:330px;background:#e8e4dc}
.panel{max-width:1100px;margin:-20px auto 0;position:relative;z-index:500;background:var(--surface);border-radius:22px 22px 0 0;padding:18px;box-shadow:0 -5px 25px rgba(40,32,22,.08)}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.locationSearch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}.locationSearch input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}.searchbtn{border:1px solid var(--line);background:#765c3c;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.locationHint{font-size:11px;color:var(--muted);margin-top:6px}.mainbtn{border:0;background:var(--ink);color:#fff;border-radius:13px;padding:13px 16px;font-size:14px;font-weight:700;width:100%;cursor:pointer;box-shadow:0 4px 12px rgba(41,38,34,.18);transition:.15s}.mainbtn:active{transform:translateY(1px)}
.statusbox{margin:12px 0 14px;padding:11px 13px;background:#faf8f3;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--muted);line-height:1.55}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 9px;font-size:11px;color:#5d5750}.pill.history{border-color:#d8c8b2;background:#faf6ef}.pill.museum{border-color:#cbd9cf;background:#f3f7f3}
#cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.eraFilters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.eraBtn{border:1px solid var(--line);background:#fff;color:#5d5750;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}.eraBtn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.timeControls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 14px;padding:10px 12px;background:#faf8f3;border:1px solid var(--line);border-radius:12px}
.openFilter{font-size:12px;font-weight:700;cursor:pointer}.openFilter input{accent-color:#4f6b52;margin-right:6px}.budgetBox{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;font-weight:700}.budgetBox input{width:110px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}.budgetBox .yen{font-weight:700}.budgetHint{font-size:11px;color:var(--muted);font-weight:400}
.timeNote{font-size:11px;color:var(--muted)}
.timeStatus{margin-top:8px;padding:8px 9px;border-radius:9px;background:#f3f6f3;color:#4f6b52;font-size:12px;line-height:1.55}
.timeStatus.warn{background:#fff5ed;color:#8a5a2f}.timeStatus.closed{background:#f6eeee;color:#8a4d4d}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;box-shadow:0 2px 9px rgba(50,40,30,.04)}.card:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:#d8cdbd}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-weight:750;font-size:16px;line-height:1.4}.walk{display:inline-flex;margin-top:7px;padding:5px 8px;border-radius:8px;background:#f3f6f3;color:#4f6b52;font-size:12px;font-weight:650}.dist{font-size:12px;color:var(--accent);white-space:nowrap;background:#f7f0e7;border-radius:999px;padding:4px 7px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.desc{font-size:12px;line-height:1.6;margin-top:8px;color:#625d57}.more{display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.more.open{display:block}.photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:8px 0}.source{font-size:11px;color:var(--muted);line-height:1.55;margin-top:8px}.loading{text-align:center;padding:28px 12px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px;grid-column:1/-1}
.officialbox{background:#faf8f3;border:1px solid #e6dfd3;border-radius:12px;padding:11px 12px;margin:10px 0;font-size:13px;line-height:1.7}.officialtitle{font-weight:750;margin-bottom:6px}.pricegrid{white-space:pre-wrap}.officiallink{display:inline-flex;align-items:center;margin-top:8px;padding:8px 10px;border-radius:9px;background:#fff;border:1px solid var(--line);text-decoration:none}.overview{background:#f5f1e8;border-left:4px solid var(--accent);border-radius:9px;padding:10px 11px;margin:9px 0;font-size:13px;line-height:1.65}.overviewtitle{font-weight:750;margin-bottom:3px}.era{font-weight:750;color:#59462e}.exhibit{background:#f5f7f5;border-radius:9px;padding:9px;margin-top:7px;font-size:12px;line-height:1.65}
footer{max-width:1100px;margin:auto;padding:18px;color:var(--muted);font-size:11px;line-height:1.6}.notice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
@media(max-width:700px){.locationSearch{grid-template-columns:1fr}.searchbtn{width:100%}header{padding:12px 14px}.brandicon{width:36px;height:36px}.brandtext h1{font-size:18px}#map{height:42vh;min-height:300px}.panel{margin-top:-16px;padding:15px 12px;border-radius:20px 20px 0 0}.controls{grid-template-columns:1fr}.mainbtn{font-size:14px;padding:14px 12px}#cards{grid-template-columns:1fr;gap:10px}.card{padding:13px}.name{font-size:15px}}
@media(min-width:1101px){body{background:linear-gradient(180deg,#f5f1e8 0,#f5f1e8 46vh,#eee8de 46vh,#eee8de 100%)}#map{width:100%}}
a{color:#5b6e83}
</style>
</head>
<body>
<header><div class="brand"><div class="brandicon">🏯</div><div class="brandtext"><h1>むかしマップ</h1><div class="sub">現在地または国内の任意地点から半径5kmの史跡・博物館・美術館を探す</div></div></div></header>
<div id="map"></div>
<section class="panel">
<div class="controls"><button class="mainbtn" onclick="findHistory()">📍 現在地を取得して周辺を検索</button></div>
<div class="locationSearch">
  <input id="placeInput" type="text" placeholder="国内の場所を入力（例：東京駅、鎌倉市、金沢市木ノ新保町）" autocomplete="off">
  <button class="searchbtn" id="placeSearchBtn">🔎 場所を検索</button>
</div>
<div class="locationHint">または、上の地図をタップして検索地点を選択できます。日本国内のみ対応しています。</div>
<div id="status" class="statusbox">現在地を取得するか、国内の場所を入力・地図上で選択すると、その地点を起点に半径5km以内を検索します。</div>
<div class="legend"><span class="pill history">🏯 史跡</span><span class="pill museum">🏛️ 博物館・美術館</span><span class="pill">📍 現在地から近い順</span><span class="pill">✓ 場所を照合</span></div>
<div class="eraFilters" aria-label="時代で絞り込む"><button class="eraBtn active" data-era="all">すべて</button><button class="eraBtn" data-era="ancient">古代</button><button class="eraBtn" data-era="medieval">中世</button><button class="eraBtn" data-era="earlymodern">近世</button><button class="eraBtn" data-era="modern">近代</button><button class="eraBtn" data-era="contemporary">現代</button></div>
<div class="timeControls">
  <label class="openFilter"><input id="openOnly" type="checkbox"> 本日営業・開館中の施設だけ表示</label>
  <div class="budgetBox"><label for="budgetInput">💰 予算</label><input id="budgetInput" type="number" min="0" step="100" inputmode="numeric" placeholder="例：1000"><span class="yen">円以内</span><span class="budgetHint">確認できた入館料・拝観料などで絞り込み</span></div>
  <div class="timeNote">現在時刻・徒歩時間・見学目安をもとに、閉館までに間に合うかも表示します。</div>
</div>
<div id="cards"></div>
</section>
<footer><div class="notice">情報は公開データから取得しています。開館時間・料金などは変更される場合があります。施設の最新情報は公式ホームページも確認してください。</div></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map=null;
if(window.L){
  map=L.map('map').setView([35.681,139.767],5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
} else {
  document.getElementById('map').innerHTML='<div style="padding:30px;text-align:center;color:#777">地図を読み込めませんでした。インターネット接続を確認して、ページを再読み込みしてください。</div>';
}
let userMarker=null,originMarker=null,markers=[],routeLayer=null,allItems=[],currentLat=null,currentLon=null,currentOriginLabel='検索地点',activeEra='all',openOnly=false,budgetLimit=null;
function setStatus(msg){document.getElementById('status').textContent=msg;}
function showError(msg){setStatus('⚠️ '+msg);document.getElementById('cards').innerHTML='<div class="loading">'+esc(msg)+'</div>';}
const overpass='https://overpass-api.de/api/interpreter';
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hav(a,b,c,d){const R=6371,rad=x=>x*Math.PI/180, x=rad(c-a),y=rad(d-b);const z=Math.sin(x/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(z));}
function cleanType(t){if(!t)return'歴史スポット';if(t==='archaeological_site')return'遺跡';if(t==='castle')return'城跡';if(t==='castle_wall')return'城跡';if(t==='monument')return'記念碑';if(t==='memorial')return'記念碑';if(t==='ruins')return'遺跡';if(t==='wayside_shrine')return'道祖神・石碑';if(t==='church')return'教会';if(t==='temple')return'寺院';if(t==='shrine')return'神社';return t;}
async function wiki(name){
 try{
  const u='https://ja.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(name);
  const r=await fetch(u); if(!r.ok) throw 0; const j=await r.json();
  return {text:j.extract||'',img:j.thumbnail?.source||'',url:j.content_urls?.desktop?.page||''};
 }catch(e){return {text:'',img:'',url:''};}
}
async function commons(name){
 try{
  const q=encodeURIComponent(name);
  const u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+q+'&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=700&format=json&origin=*';
  const j=await (await fetch(u)).json(); const p=Object.values(j.query?.pages||{})[0];
  return p?.imageinfo?.[0]?.thumburl||p?.imageinfo?.[0]?.url||'';
 }catch(e){return '';}
}
async function searchNearby(lat,lon,label='検索地点'){
  if(!isJapanCoord(lat,lon)){showError('日本国内の地点を選択してください。');return;}
  currentLat=lat; currentLon=lon; currentOriginLabel=label;
  if(map){
    if(originMarker)map.removeLayer(originMarker);
    originMarker=L.circleMarker([lat,lon],{radius:9}).addTo(map).bindPopup(esc(label)).openPopup();
    map.setView([lat,lon],14);
    markers.forEach(m=>map.removeLayer(m));markers=[];
    if(routeLayer){map.removeLayer(routeLayer);routeLayer=null;}
  }
  document.getElementById('status').textContent='半径5km以内の歴史スポットを検索しています…';
  document.getElementById('cards').innerHTML='<div class="loading">🔎 '+esc(label)+'の周辺を検索中…</div>';
  const q=`[out:json][timeout:25];(nwr(around:5000,${lat},${lon})["historic"~"^(archaeological_site|castle|ruins|fort|fortification|battlefield|manor|city_gate|church|chapel|temple|monastery)$"];nwr(around:5000,${lat},${lon})["heritage"~"^(1|2|3|local)$"];nwr(around:5000,${lat},${lon})["amenity"="place_of_worship"]["religion"="shinto"];nwr(around:5000,${lat},${lon})["tourism"="museum"];nwr(around:5000,${lat},${lon})["tourism"="gallery"];nwr(around:5000,${lat},${lon})["amenity"="museum"];nwr(around:5000,${lat},${lon})["museum"];nwr(around:5000,${lat},${lon})["art_gallery"="yes"];nwr(around:5000,${lat},${lon})["building"="museum"];);out center tags;`;
  try{
    const r=await fetch(overpass,{method:'POST',body:'data='+encodeURIComponent(q)});
    if(!r.ok)throw 0; const data=await r.json();
    const seen=new Set(),items=[];
    for(const e of data.elements){
      const t=e.tags||{},name=t.name||t['name:ja']||t['name:en'];
      if(!name)continue;
      if(t.historic==='wayside_shrine' || t.historic==='memorial' || t.historic==='monument' || t.historic==='tomb' || t.historic==='boundary_stone' || t.historic==='milestone')continue;
      if(isGenericReligiousName(name,t))continue;
      const kind=isMuseum(t)?'museum':'history';
      const la=e.lat??e.center?.lat,lo=e.lon??e.center?.lon;if(la==null||lo==null)continue;
      const key=name+'|'+la.toFixed(5)+'|'+lo.toFixed(5);if(seen.has(key))continue;seen.add(key);
      const d=hav(lat,lon,la,lo);if(d<=5)items.push({e,t,name,la,lo,d,kind});
    }
    items.sort((a,b)=>a.d-b.d);
    verifyAndRender(items,lat,lon,label);
  }catch(e){
    document.getElementById('status').textContent='検索に失敗しました。通信環境やAPIの混雑をご確認ください。';
    document.getElementById('cards').innerHTML='<div class="loading">周辺データを取得できませんでした。</div>';
  }
}
function isJapanCoord(lat,lon){
  return Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=24&&lat<=46.2&&lon>=122&&lon<=153.9;
}
window.findHistory=async function(){
 if(!navigator.geolocation){showError('このブラウザでは位置情報を取得できません。Chromeなどのブラウザで開いてください。');return}
 if(!window.isSecureContext){showError('位置情報を使うにはHTTPSなどの安全な接続が必要です。このファイルをChatGPTアプリ内ではなく、Chromeで開いてください。');return}
 setStatus('📍 現在地を取得しています…（位置情報の許可が表示されたら「許可」を押してください）');
 document.getElementById('cards').innerHTML='<div class="loading">📍 GPSを確認中…</div>';
 navigator.geolocation.getCurrentPosition(async pos=>{
   const lat=pos.coords.latitude,lon=pos.coords.longitude;
   if(!isJapanCoord(lat,lon)){showError('現在地が日本国内として認識できませんでした。');return}
   if(map){
     if(userMarker)map.removeLayer(userMarker);
     userMarker=L.circleMarker([lat,lon],{radius:9}).addTo(map).bindPopup('現在地').openPopup();
   }
   await searchNearby(lat,lon,'現在地');
 },err=>{
   const msg=err?.code===1?'位置情報の使用が拒否されています。ブラウザのサイト設定で位置情報を「許可」にしてください。':err?.code===2?'現在地を取得できませんでした。GPS・Wi-Fiをオンにして、もう一度試してください。':err?.code===3?'現在地の取得がタイムアウトしました。屋外などGPSを受信しやすい場所でもう一度試してください。':'位置情報を取得できませんでした。もう一度お試しください。';
   showError(msg);
 },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
async function searchPlaceByText(){
 const input=document.getElementById('placeInput');
 const q=String(input?.value||'').trim();
 if(!q){showError('検索する国内の場所を入力してください。');return;}
 if(q.length>100){showError('場所の入力は100文字以内にしてください。');return;}
 setStatus('🔎 場所を検索しています…');
 document.getElementById('cards').innerHTML='<div class="loading">📍 入力した場所を地図上で探しています…</div>';
 try{
   // 国土地理院地図の地名検索機能を、ユーザーが明示的に検索したときだけ利用する。
   const u='https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q);
   const r=await fetch(u); if(!r.ok)throw 0;
   const data=await r.json();
   const results=Array.isArray(data)?data:(data?.results||[]);
   const candidates=results.map(x=>{
     const c=x?.geometry?.coordinates||x?.coordinates;
     const lon=Number(c?.[0]),lat=Number(c?.[1]);
     return {lat,lon,name:x?.properties?.title||x?.properties?.address||x?.properties?.name||q};
   }).filter(x=>isJapanCoord(x.lat,x.lon));
   if(!candidates.length)throw 0;
   const best=candidates[0];
   if(originMarker&&map)map.removeLayer(originMarker);
   if(map){originMarker=L.circleMarker([best.lat,best.lon],{radius:9}).addTo(map).bindPopup(esc(best.name)).openPopup();}
   await searchNearby(best.lat,best.lon,best.name);
 }catch(e){
   showError('場所を検索できませんでした。市区町村名・駅名・施設名・住所など、もう少し具体的に入力して再検索してください。');
 }
}
document.getElementById('placeSearchBtn')?.addEventListener('click',searchPlaceByText);
document.getElementById('placeInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')searchPlaceByText();});

if(map){
 map.on('click',async e=>{
   const {lat,lng}=e.latlng;
   if(!isJapanCoord(lat,lng)){setStatus('⚠️ 日本国内の地点を選択してください。');return;}
   const label='地図で選択した地点';
   if(originMarker)map.removeLayer(originMarker);
   originMarker=L.circleMarker([lat,lng],{radius:9}).addTo(map).bindPopup(label).openPopup();
   await searchNearby(lat,lng,label);
 });
}
function normName(s){return String(s||'').toLowerCase().replace(/[\s　・･,，.．()（）「」『』\[\]【】\-‐‑–—]/g,'').replace(/跡$/,'');}
function isGenericReligiousName(name,t){
 const n=String(name||'').replace(/[\s　]/g,'');
 if(t.amenity!=='place_of_worship' || t.religion!=='shinto') return false;
 // Generic shrines that exist in many places are not useful as unique historical sites.
 if(/^(稲荷神社|八幡神社|天満宮|天神社|浅間神社|熊野神社|白山神社|諏訪神社|春日神社|住吉神社|日枝神社|氷川神社|琴平神社|愛宕神社|秋葉神社|八坂神社)$/.test(n)) return true;
 return false;
}
function isMuseum(t){
 return t.tourism==='museum'||t.tourism==='gallery'||t.amenity==='museum'||!!t.museum||t.artwork_type==='gallery'||t.art_gallery==='yes'||t.building==='museum';
}
function museumType(t){
 if(t.tourism==='gallery'||t.art_gallery==='yes'||t.artwork_type==='gallery') return '美術館・ギャラリー';
 if(t.museum==='history'||t.museum==='archaeology'||t.tourism==='museum') return '博物館';
 return '博物館・美術館';
}
function officialUrl(t){return t.website||t['contact:website']||t.url||'';}
function feeText(t){
 if(t.fee==='no'||t.charge==='0'||t.charge==='無料') return '無料';
 return t.charge||t.fee||'';
}
function extractFeeAmounts(text){
 const raw=String(text||'').replace(/[,，]/g,'');
 if(!raw)return [];
 const amounts=[];
 // 円表記を優先。無料は0円として扱う。
 if(/無料/.test(raw)) amounts.push(0);
 for(const m of raw.matchAll(/(\d{1,6})\s*円/g)) amounts.push(Number(m[1]));
 // 「\500」等ではなく、料金欄の数値のみを対象にする。
 return [...new Set(amounts)].filter(n=>Number.isFinite(n)&&n>=0);
}
function knownFeeInfo(p){
 const osm=feeText(p.t||{});
 const official=p._officialText||'';
 // 公式サイト全体の数字（年、時刻、所要時間など）を料金と誤認しないよう、料金欄だけを解析する。
 const officialFees=official?extractOfficialInfo(official).fees:'';
 const amounts=[...extractFeeAmounts(osm),...extractFeeAmounts(officialFees)];
 const free=/^(無料|no|0)$/i.test(String(osm).trim()) || /無料/.test(officialFees);
 if(free) amounts.push(0);
 const unique=[...new Set(amounts)].sort((a,b)=>a-b);
 if(!unique.length)return {known:false,amounts:[],min:null,max:null,budgetAmount:null,label:'料金情報なし'};
 // 予算判定は一般・大人料金を優先し、それが明記されない場合は料金欄の最高額を採用。

function decodePolyline6(str){

  const official=officialUrl(p.t), fee=feeText(p.t), hours=hoursText(p.t);
  const intro=p.kind==='museum'?'公開情報・施設位置を確認できる博物館／美術館。':'Wikipediaの名称・座標を照合済み。';
  const ov=p.kind==='museum'?museumOverview(p,''):historyOverview(p);
  let short='';
  if(p.kind==='museum'){ short=(ov.era?'時代：'+ov.era+'｜':'')+'展示：'+ov.exhibit; }
  else { short=(ov.era?'時代：'+ov.era+'｜':'')+ov.body; }
  const initialVisit=getVisitMinutes(p);
  const feeInfo=knownFeeInfo(p);
  const feeLabel=feeInfo.known?'💰 料金：'+feeInfo.label:'💰 料金：公式情報なし';
  const visitLabel=initialVisit?('約'+(typeof initialVisit==='object'?initialVisit.min+'～'+initialVisit.max+'分':initialVisit+'分')):'公式情報なし';
  card.innerHTML='<div class="head"><div class="name">'+esc(p.name)+'</div><div class="dist">'+p.d.toFixed(2)+' km</div></div><div class="meta">'+esc(type)+(p.t.start_date?'｜'+esc(p.t.start_date):'')+'</div><div class="walk" data-walk="1">🚶 徒歩時間を計算中…</div><div class="source">'+esc(feeLabel)+' ｜ 👀 見学目安：'+esc(visitLabel)+'</div><div class="overview"><div class="overviewtitle">'+(p.kind==='museum'?'🏛 この施設について':'🏯 この史跡について')+'</div>'+esc(short)+'</div><div class="desc">'+esc(intro)+' クリックすると詳細・写真・開館情報を表示します。</div><div class="more"></div>';
  card.onclick=async()=>{
   if(map){map.setView([p.la,p.lo],16);if(m)m.openPopup();}
   const more=card.querySelector('.more'),desc=card.querySelector('.desc');
   if(more.classList.contains('open')){more.classList.remove('open');return}
   more.classList.add('open');more.innerHTML='<div>公開情報を確認しています…</div>';
   const officialText = p.kind==='museum' ? await fetchOfficialText(official) : '';
   const officialInfo = compactOfficialInfo(extractOfficialInfo(officialText));
   const [w,c]=await Promise.all([Promise.resolve(p.w||await wiki(p.name)),commons(p.name)]);
   desc.textContent=w?.text||p.t.description||'公開情報から詳細な解説を取得できませんでした。';
   let s='';
   const walk=await walkingTime(lat,lon,p.la,p.lo);
   p._officialText=officialText;
   p._timeInfo=timeFeasibility(p,walk.text,officialText||hoursText(p.t));
   showRoute(walk.coords,{lat:p.la,lon:p.lo});
   const walkEl=card.querySelector('[data-walk]'); if(walkEl)walkEl.textContent='🚶 '+walk.text;
   const detailOv=p.kind==='museum'?museumOverview(p,officialText):historyOverview(p);
   s+='<div class="officialbox"><div class="officialtitle">⏱️ 今日の時間計画</div><b>🚶 徒歩：約'+esc(String(p._timeInfo.walk))+'分</b><br><b>🏛 見学・滞在の目安：'+esc(p._timeInfo.visit?(typeof p._timeInfo.visit==='object'?('約'+p._timeInfo.visit.min+'～'+p._timeInfo.visit.max+'分'):('約'+p._timeInfo.visit+'分')):'公式情報なし')+'</b><br><b>⏳ 徒歩＋見学：'+esc(p._timeInfo.total!=null?('最長約'+p._timeInfo.total+'分'):'算出不可')+'</b>';
   if(p._timeInfo.known){
     if(p._timeInfo.openNow===false) s+='<div class="timeStatus closed">本日は現在、開館・営業していない可能性があります。 '+esc(p._timeInfo.label)+'</div>';
     else if(p._timeInfo.canFinish===true) s+='<div class="timeStatus">✓ 現在時刻から徒歩＋見学をしても、本日の閉館時刻までに間に合う計算です。<br>'+esc(p._timeInfo.label)+'</div>';
     else s+='<div class="timeStatus warn">⚠️ 現在時刻から徒歩＋見学をすると、本日の閉館時刻に間に合わない計算です。<br>'+esc(p._timeInfo.label)+'</div>';
   }else{
     s+='<div class="timeStatus warn">開館時間を自動判定できないため、閉館に間に合うかは判定できません。</div>';
   }
   s+=(walk.detail?'<div class="source">'+esc(walk.detail)+'</div>':'')+'</div>';
   s+='<div class="overview"><div class="overviewtitle">'+(p.kind==='museum'?'🏛 展示・収蔵内容':'🏯 時代・概要')+'</div>';
   if(detailOv.era)s+='<div class="era">時代：'+esc(detailOv.era)+'</div>';
   if(p.kind==='museum')s+='<div class="exhibit">'+esc(detailOv.exhibit||'公開情報から展示内容を確認できませんでした。')+'</div>';
   else s+='<div>'+esc(detailOv.body)+'</div>';
   s+='</div>';
   if(c)s+='<img class="photo" src="'+esc(c)+'" alt="'+esc(p.name)+'の写真">';
   if(p.kind==='museum'){
    s+='<div class="officialbox"><div class="officialtitle">🏛 公式サイトから取得した施設情報</div>';
    if(officialInfo.hours) s+='<b>開館時間：</b><div class="pricegrid">'+esc(officialInfo.hours)+'</div>';
    else if(hours) s+='<b>開館時間：</b><div class="pricegrid">'+esc(hours)+'</div>';
    else s+='<b>開館時間：</b>公式サイトから自動取得できませんでした。<br>';
    if(officialInfo.closed) s+='<b>休館日：</b><div class="pricegrid">'+esc(officialInfo.closed)+'</div>';
    if(officialInfo.fees) s+='<b>料金：</b><div class="pricegrid">'+esc(officialInfo.fees)+'</div>';
    else if(fee) s+='<b>料金：</b><div class="pricegrid">'+esc(fee)+'</div>';
    else s+='<b>料金：</b>公式サイトから自動取得できませんでした。<br>';
    if(official)s+='<a class="officiallink" href="'+esc(official)+'" target="_blank" rel="noopener">🔗 公式ホームページを開く</a>';
    s+='</div>';
    s+='<div class="source">※公式サイトの文章から自動抽出しています。展覧会ごとに料金・時間が変わる場合や、臨時変更がある場合は公式サイトの最新情報も確認してください。</div>';
   }
   if(w?.url)s+='<div class="source">詳しい解説：Wikipedia（日本語）｜<a href="'+esc(w.url)+'" target="_blank" rel="noopener">出典ページを開く</a></div>';
   s+='<div class="source">位置・名称：OpenStreetMap｜解説：Wikipedia照合済み</div>';
   more.innerHTML=s||'<div class="source">公開画像・解説は見つかりませんでした。</div>';
  };
  if(p._timeInfo?.known){
   const ts=document.createElement('div');
   ts.className='timeStatus '+(p._timeInfo.canFinish===false?'warn':'');
   ts.textContent=p._timeInfo.canFinish===true?'✓ 今日の閉館までに間に合う見込み':(p._timeInfo.openNow===false?'本日は現在、開館・営業していない可能性があります':'営業時間を確認してください');
   card.appendChild(ts);
  }
  box.appendChild(card);
 });
}
</script>
</body></html>
